<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%" style="background: linear-gradient(135deg, #090d16 0%, #0d1b2a 45%, #1b263b 80%, #0d1b2a 100%); border-radius: 18px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.4);">
  <defs>
    <!-- Gradients -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="pulseGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.35; }
      50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.6; }
    }
    @keyframes pulseOrb2 {
      0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.25; }
      50% { transform: scale(1.2) translate(-25px, 15px); opacity: 0.55; }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes beacon {
      0%, 100% { r: 5px; opacity: 1; }
      50% { r: 11px; opacity: 0.4; }
    }
    @keyframes cardFloat1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes cardFloat2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-9px); }
    }
    @keyframes cardFloat3 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }

    .bg-orb-1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: center; }
    .bg-orb-2 { animation: pulseOrb2 10s ease-in-out infinite; transform-origin: center; }
    .flow-line { stroke-dasharray: 20 15; animation: flowLine 12s linear infinite; }
    .status-dot { animation: beacon 2s ease-in-out infinite; }
    .card-1 { animation: cardFloat1 5s ease-in-out infinite; }
    .card-2 { animation: cardFloat2 6s ease-in-out infinite 0.7s; }
    .card-3 { animation: cardFloat3 5.5s ease-in-out infinite 1.4s; }
  </style>

  <!-- Background Dynamic Mesh & Tech Glows (Z-index: Deep Background) -->
  <g id="dynamic-ambient">
    <circle class="bg-orb-1" cx="150" cy="100" r="140" fill="url(#pulseGlow)" filter="url(#glow)" />
    <circle class="bg-orb-2" cx="1050" cy="300" r="180" fill="url(#pulseGlow)" filter="url(#glow)" />
    
    <!-- Cyber Grid Subtle Lines -->
    <path d="M0,70 L1200,70 M0,140 L1200,140 M0,210 L1200,210 M0,280 L1200,280 M0,350 L1200,350" stroke="#334155" stroke-opacity="0.18" stroke-width="1" />
    <path d="M150,0 L150,420 M300,0 L300,420 M450,0 L450,420 M600,0 L600,420 M750,0 L750,420 M900,0 L900,420 M1050,0 L1050,420" stroke="#334155" stroke-opacity="0.18" stroke-width="1" />
    
    <!-- Flow Pipeline Wave -->
    <path class="flow-line" d="M 50,330 Q 300,300 600,340 T 1150,320" fill="none" stroke="url(#flowGrad)" stroke-width="3" />
  </g>

  <!-- Foreground Main Title & Badges (Highest Contrast, Guaranteed Foreground) -->
  <g id="main-content" transform="translate(60, 45)">
    <!-- Category Badge -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="270" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="1.2" />
      <circle class="status-dot" cx="18" cy="15" r="5" fill="#38bdf8" />
      <text x="32" y="19" fill="#94a3b8" font-size="12" font-weight="600" letter-spacing="1">CURATED DIRECTORY &bull; 2026</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="78" fill="url(#headerGrad)" font-size="38" font-weight="800" letter-spacing="-0.5">
      Awesome Autonomous Immigration
    </text>
    <text x="0" y="124" fill="#f8fafc" font-size="36" font-weight="800" letter-spacing="-0.5">
      &amp; Visa Trackers
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="162" fill="#94a3b8" font-size="16" font-weight="400">
      Case Status Monitoring &bull; Priority Dates &bull; Autonomous Workflows &bull; Open-Source &amp; SaaS
    </text>

    <!-- Metrics / Feature Pills Row -->
    <g transform="translate(0, 185)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="128" height="28" rx="7" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="12" y="18" fill="#38bdf8" font-size="11" font-weight="700">⚡ REAL-TIME</text>
      <text x="76" y="18" fill="#cbd5e1" font-size="11">USCIS</text>

      <!-- Pill 2 -->
      <rect x="138" y="0" width="132" height="28" rx="7" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="150" y="18" fill="#a855f7" font-size="11" font-weight="700">🔒 100%</text>
      <text x="189" y="18" fill="#cbd5e1" font-size="11">PRIVACY</text>

      <!-- Pill 3 -->
      <rect x="280" y="0" width="142" height="28" rx="7" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="292" y="18" fill="#10b981" font-size="11" font-weight="700">🤖 AI-POWERED</text>
      <text x="375" y="18" fill="#cbd5e1" font-size="11">CRMs</text>

      <!-- Pill 4 -->
      <rect x="432" y="0" width="148" height="28" rx="7" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="444" y="18" fill="#f59e0b" font-size="11" font-weight="700">🌐 MULTI-NATION</text>
      <text x="548" y="18" fill="#cbd5e1" font-size="11">VISAS</text>
    </g>
  </g>

  <!-- Interactive Dynamic Visual Status Cards (Floating in bottom-center/right) -->
  <g id="floating-cards" transform="translate(60, 275)">
    <!-- Card 1: USCIS Tracker -->
    <g class="card-1" transform="translate(0, 0)">
      <rect x="0" y="0" width="330" height="92" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.2" filter="drop-shadow(0 8px 16px rgba(0,0,0,0.4))" />
      <circle cx="28" cy="30" r="14" fill="#0284c7" fill-opacity="0.25" />
      <text x="22" y="35" fill="#38bdf8" font-size="16">🏛️</text>
      <text x="54" y="27" fill="#f1f5f9" font-size="14" font-weight="700">USCIS &amp; NVC Tracking</text>
      <text x="54" y="44" fill="#94a3b8" font-size="11">I-485 &bull; I-140 &bull; I-765 &bull; I-130 &bull; N-400</text>
      
      <!-- Progress Bar indicator -->
      <rect x="54" y="58" width="220" height="6" rx="3" fill="#334155" />
      <rect x="54" y="58" width="175" height="6" rx="3" fill="#38bdf8" />
      <text x="282" y="64" fill="#38bdf8" font-size="10" font-weight="bold">ACTIVE</text>
    </g>

    <!-- Card 2: Legal Tech CRM -->
    <g class="card-2" transform="translate(365, 0)">
      <rect x="0" y="0" width="330" height="92" rx="12" fill="url(#cardGrad)" stroke="#818cf8" stroke-opacity="0.3" stroke-width="1.2" filter="drop-shadow(0 8px 16px rgba(0,0,0,0.4))" />
      <circle cx="28" cy="30" r="14" fill="#6366f1" fill-opacity="0.25" />
      <text x="22" y="35" fill="#818cf8" font-size="16">⚖️</text>
      <text x="54" y="27" fill="#f1f5f9" font-size="14" font-weight="700">Legal Mobility &amp; CRM</text>
      <text x="54" y="44" fill="#94a3b8" font-size="11">e-Filing &bull; Form Automation &bull; Priority Dates</text>

      <rect x="54" y="58" width="220" height="6" rx="3" fill="#334155" />
      <rect x="54" y="58" width="195" height="6" rx="3" fill="#818cf8" />
      <text x="282" y="64" fill="#818cf8" font-size="10" font-weight="bold">SYNCED</text>
    </g>

    <!-- Card 3: Autonomous Webhooks & Bots -->
    <g class="card-3" transform="translate(730, 0)">
      <rect x="0" y="0" width="330" height="92" rx="12" fill="url(#cardGrad)" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.2" filter="drop-shadow(0 8px 16px rgba(0,0,0,0.4))" />
      <circle cx="28" cy="30" r="14" fill="#059669" fill-opacity="0.25" />
      <text x="22" y="35" fill="#10b981" font-size="16">🔔</text>
      <text x="54" y="27" fill="#f1f5f9" font-size="14" font-weight="700">Autonomous Alerting</text>
      <text x="54" y="44" fill="#94a3b8" font-size="11">Telegram &bull; Webhooks &bull; Email &bull; Docker</text>

      <rect x="54" y="58" width="220" height="6" rx="3" fill="#334155" />
      <rect x="54" y="58" width="210" height="6" rx="3" fill="#10b981" />
      <text x="282" y="64" fill="#10b981" font-size="10" font-weight="bold">24/7 LIVE</text>
    </g>
  </g>
</svg>
